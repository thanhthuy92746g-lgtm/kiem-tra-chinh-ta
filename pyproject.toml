[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietspell"
version = "0.1.0"
description = "Soát chính tả và thể thức Word tiếng Việt, hoàn toàn ngoại tuyến"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["python-docx==1.2.0", "PySide6==6.8.3"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pyinstaller==6.16.0"]

[project.scripts]
vietspell = "vietspell.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
