name: VietSpell checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install Qt runtime libraries on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Run pytest with readable failure diagnostics
        run: python tools/ci_command.py --log pytest-output.txt -- -m pytest -q -p no:cacheprovider
      - run: python tools/ci_command.py --log bootstrap-output.txt -- tools/bootstrap_data.py
      - run: python tools/make_sample.py
      - run: python tools/smoke_gui.py data/sample.docx --report data/ci-gui-smoke.json

  windows-trained-package:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/build/windows-exe')
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Restore the verified trained model
        run: python tools/ci_command.py --log model-restore-output.txt -- tools/ci_model.py restore
      - name: Build and verify Windows executables
        run: python tools/ci_command.py --log windows-build-output.txt -- tools/package_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: VietSpell-Windows-x64-trained
          path: dist/VietSpell-Windows-x64-trained.zip
          if-no-files-found: error
          retention-days: 14
      - name: Keep verification reports for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VietSpell-Windows-build-reports
          path: build/windows-verification/
          if-no-files-found: ignore
          retention-days: 14
